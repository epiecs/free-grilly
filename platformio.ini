; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev   ; plain `pio run` (CI, release script) only builds the firmware

[env:esp32dev]
platform = espressif32@7.1.3   ; pinned: an unpinned platform made builds behave differently (backlight at shutdown)
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps = 
	bblanchon/ArduinoJson@^7.3.1
	robtillaart/UUID@^0.1.6
	olikraus/U8g2@^2.36.5
	knolleary/PubSubClient@^2.8
build_flags = 
	-D grilleye=true
monitor_filters = esp32_exception_decoder
extra_scripts = pre:tools/build_web.py

; Host unit tests for the hardware-independent libraries: pio test -e native
; Needs a host C++ compiler (gcc), so it runs in CI.
[env:native]
platform = native
test_framework = unity
